
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Athletics | Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">PEAK <span>ATHLETICS.</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="order.html">Order</a>
  </nav>
</header>

<section class="page-heading">
  <p class="eyebrow">GET YOUR GEAR</p>
  <h1>PLACE YOUR ORDER.</h1>
  <p>Fill in your details below.</p>
</section>

<section class="order-section">
  <form id="orderForm">

    <div class="form-row">
      <div>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" required>
      </div>

      <div>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" required>
      </div>
    </div>

    <label for="email">Email Address</label>
    <input type="email" id="email" required>

    <label for="product">Choose Product</label>
    <select id="product" required>
      <option value="">Select a product</option>
      <option>Football</option>
      <option>Basketball</option>
      <option>Running Shoes</option>
      <option>Gym Equipment</option>
      <option>Sports Jersey</option>
      <option>Sports Gloves</option>
      <option>Water Bottle</option>
      <option>Sports Bag</option>
      <option>Sports Socks</option>
    </select>

    <label for="address">Delivery Address</label>
    <textarea id="address" rows="5" required></textarea>


<h3>PAYMENT DETAILS</h3>

<label for="payment">Payment Method</label>
<select id="payment" name="payment" required>
  <option value="">Choose payment method</option>
  <option>M-Pesa</option>
  <option>Debit / Credit Card</option>
  <option>Cash on Delivery</option>
</select>

<label for="phone">M-Pesa Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number">

<label for="cardNumber">Card Number </label>
<input type="text" id="cardNumber" placeholder="0000 0000 0000 0000">




    <button type="submit" class="btn">SUBMIT ORDER</button>

    <p id="message"></p>
  </form>
</section>

<footer>
  <p>© 2026 Peak Athletics. All rights reserved.</p>
</footer>

<script src="script.js"></script>


</body>
</html>
